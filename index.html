<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Hub</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
  <h2>Hub</h2>
  <button onclick="go('index.html')">🏠 Home</button>
  <button onclick="go('slideshow.html')">🖼️ Display</button>
  <button onclick="go('settings.html')">⚙️ Settings</button>
</div>

<div class="main">

  <div class="topbar">
    <h1>Home</h1>
    <div id="topTime"></div>
  </div>

  <div class="grid">

    <div class="card big">
      <h2>🫧 Smart Display</h2>
      <p>Tap to enter fullscreen mode</p>
      <button onclick="go('slideshow.html')">Open</button>
    </div>

    <div class="card">
      <h3>💡 Lights</h3>
      <button onclick="toggleLight()">Toggle</button>
      <p id="lightStatus">OFF</p>
    </div>

    <div class="card">
      <h3>🔌 Plug</h3>
      <button onclick="togglePlug()">Toggle</button>
      <p id="plugStatus">OFF</p>
    </div>

    <div class="card">
      <h3>⏳ Countdown</h3>
      <p id="countdown"></p>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
